version: '3.8'

services:
  # MySQL 資料庫服務
  mysql-db:
    image: mysql:8.0
    container_name: hyweb-mysql
    restart: always
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    # 建立健康檢查，確保 MySQL 準備好連線
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-uapp_user", "-papp_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Golang API 服務
  api-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyweb-api-container
    restart: always
    ports:
      - "8080:8080"
    # 確保資料庫健康檢查通過後再啟動 API
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data: