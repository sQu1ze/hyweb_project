basePath: /api/v1
definitions:
  hyweb-api_internal_model.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  hyweb-api_internal_model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  hyweb-api_internal_model.RegisterRequest:
    properties:
      email:
        maxLength: 50
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  hyweb-api_internal_response.Response:
    properties:
      code:
        type: integer
      data: {}
      error: {}
      message:
        type: string
      success:
        type: boolean
      timestamp:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a sample server for a Gin-Gonic API.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Gin-Gonic API
  version: "1.0"
paths:
  /health:
    get:
      description: 檢查服務是否正常運作
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hyweb-api_internal_response.Response'
      summary: 健康檢查
      tags:
      - System
  /users/changePassword:
    put:
      consumes:
      - application/json
      description: 驗證舊密碼後更換新密碼
      parameters:
      - description: 修改密碼資料
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hyweb-api_internal_model.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/hyweb-api_internal_response.Response'
      security:
      - BearerAuth: []
      summary: 修改密碼
      tags:
      - Users
  /users/login:
    post:
      consumes:
      - application/json
      description: 驗證身分並回傳 JWT
      parameters:
      - description: 登入資料
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hyweb-api_internal_model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/hyweb-api_internal_response.Response'
      summary: 使用者登入
      tags:
      - Users
  /users/register:
    post:
      consumes:
      - application/json
      description: 建立新帳號並將密碼加密儲存
      parameters:
      - description: 註冊資料
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hyweb-api_internal_model.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/hyweb-api_internal_response.Response'
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/hyweb-api_internal_response.Response'
      summary: 使用者註冊
      tags:
      - Users
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
